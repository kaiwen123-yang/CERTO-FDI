name: ci

on:
  push:
    branches: ["main", "stage/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Repository hygiene check
        run: bash scripts/check_repo_hygiene.sh

      - name: Unit tests (CPU, no slow marks, no external storage)
        run: python -m pytest -q -m "not slow"
