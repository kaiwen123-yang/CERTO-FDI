project: CERTO-FDI
stage: stage1r_ligra
method_codename: LiGRA-FDI
seed_list: [260815, 260816, 260817]

paths:
  linux_repo: "${HOME}/research/CERTO-FDI"
  linux_worktree: "${HOME}/research/CERTO-FDI-WORKTREES/stage1r-ligra-representation"
  persistent_root: "/mnt/g/CERTO-FDI"
  data_root: "/mnt/g/CERTO-FDI/03_data/stage1r"
  run_root: "/mnt/g/CERTO-FDI/04_runs/stage1r_ligra"

robot:
  name: franka_emika_panda
  dof: 7
  truth_backend: mujoco
  analytic_backend: pinocchio
  fixed_base: true

simulation:
  physics_dt_s: 0.001
  control_dt_s: 0.002
  log_rate_hz: 500
  episode_duration_s: 12
  window_samples: 128

pilot:
  healthy_episodes: 48
  fault_episodes_per_family: 24
  controllers: [computed_torque, pd_gravity]
  training_fractions: [0.10, 0.25, 0.50, 1.00]
  fewshot_counts: [5, 20, 50]

model:
  scalar_encoder: gru
  scalar_hidden_dim: 64
  scalar_layers: 2
  wrench_basis_dim: 12
  anomaly_head: conditional_gaussian
  flow_head_enabled: false

faults:
  actuator_efficiency: [0.05, 0.10, 0.20, 0.30]
  viscous_scale: [0.20, 0.50, 1.00]
  coulomb_scale: [0.20, 0.50, 1.00]
  payload_mass_kg: [0.25, 0.50, 1.00]
  encoder_bias_rad: [0.002, 0.005, 0.010]
  command_delay_s: [0.002, 0.005, 0.010, 0.020]
  contact_force_n: [2.0, 5.0, 10.0]

frame_trials:
  variants_per_episode: 8
  rotation_angle_max_deg: 180
  translation_fraction_of_link_length: 0.25

calibration:
  use_faults_for_threshold: false
  healthy_quantile: 0.995

execution:
  start_with_smoke: true
  require_r0_pass_before_training: true
  keep_pr_draft: true
  auto_merge: false
