  scores: [all_joint_residual_energy_BLIND_PRIMARY, per_joint_standardized, joint3_DIAGNOSTIC_ONLY]
  controls: [same_capacity_direct_anomaly, permuted_joint, context_permuted_calibration]

gates:  # mirrors 03_DECISION_RULES.yaml; tested for equality
  mead_physics_residual:
    min_tasks_with_gain: 4
    tasks_total: 7
    auroc_gain: 0.03
    auprc_gain: 0.05
    max_relative_fpr_tpr90_worsening: 0.10
    min_concordant_seeds: 2
    require_blind_all_joint_score: true
    require_permuted_joint_control: true
    require_earlier_detection_in_min_tasks: 4
  context_calibration:
    min_datasets: 2
    min_false_alarm_reduction_fraction: 0.30
    min_frontends: 3
    min_concordant_seeds: 2
    require_permutation_control: true
    require_no_detection_degradation: true

