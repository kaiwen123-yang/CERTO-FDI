# CERTO-FDI Stage 1R-B configuration: typed-equivariant capacity audit on the frozen Stage 1R pilot data.
# Derived from 11_STAGE1RB_CONFIG_TEMPLATE.yaml (kickoff 6793482a…) + the frozen pilot config
# (configs/stage1r_pilot.yaml, data-generating commit 4280d2f = SHA 24e57b24…). Nothing about the
# data, splits, contexts or fault labels changes; this file only freezes the Stage 1R-B protocol.
project: CERTO-FDI
stage: stage1r_b_equivariant_capacity
profile: pilot_reuse
method_codename: LiGRA-v2-Typed
seed_list: [260815, 260816, 260817]

paths:
  persistent_root: "/mnt/g/CERTO-FDI"
  data_root: "/mnt/g/CERTO-FDI/03_data/stage1r"          # existing pilot data root (reused, never regenerated)
  existing_reference_run: "/mnt/g/CERTO-FDI/05_reference_results/stage1r/run_20260815T042745Z_stage1r"
  run_root: "/mnt/g/CERTO-FDI/04_runs/stage1r_b_equivariant_capacity"
  mjcf_path: "/mnt/g/CERTO-FDI/01_frozen_sources/extracted/mujoco_menagerie_franka_emika_panda_da76818/franka_emika_panda/panda_nohand.xml"
  menagerie_commit: "da76818e269b82289eba39808e2fb91d679d6994"

repository:
  remote: git@github.com:kaiwen123-yang/CERTO-FDI.git
  base_branch: stage/stage1r-ligra-representation
  stage_branch: stage/stage1r-b-equivariant-capacity-audit
  keep_pr_draft: true
  auto_merge: false

frozen_inputs:
  stage1r_full_zip_sha256: 5512cbac03c8bd5e8babcd86dd63ebb5b91bd82a1e77acabdb2c63104a833192
  stage1rb_kickoff_zip_sha256: 6793482a351f6eb8d4a48d6cda5ad140395b138b3520b479f89ec1ea779dd7e1
  pilot_config_sha256: 24e57b244e83ddc647bccbd978f457947e9c5d632768a0d6e3780d8358ce1ea3   # dataset_manifest.json:config_sha256
  mjcf_sha256: e7090a5e2384b18a223ef532d98bf914f7f9a6b74dc8bc9f74c8291201074071
  dataset_profile: pilot
  dataset_seed: 260815
  regenerate_data: false

robot:
  name: franka_emika_panda
  dof: 7
  truth_backend: mujoco
  analytic_backend: pinocchio
  fixed_base: true

# identical to the frozen pilot (data) + the pilot-evaluation settings of PR #2 (window/stride/settle)
simulation:
  physics_dt_s: 0.001
  control_dt_s: 0.002
  log_rate_hz: 500
  episode_duration_s: 12
  window_samples: 128
  window_stride: 32
  window_stride_eval: 16
  eval_settle_s: 1.0

plant_mismatch:
  inertial_param_relative_perturbation: 0.05
  nominal_viscous_nms: [0.8, 0.8, 0.6, 0.6, 0.4, 0.3, 0.3]
  nominal_coulomb_nm:  [0.9, 0.9, 0.7, 0.7, 0.4, 0.3, 0.3]
  truth_viscous_scale_range: [0.85, 1.15]
  truth_coulomb_scale_range: [0.85, 1.15]
  truth_stribeck_nm: [0.6, 0.6, 0.5, 0.5, 0.3, 0.2, 0.2]
  truth_stribeck_velocity: 0.15
  measurement_noise:
    q_std_rad: 0.0002
    qd_std_rad_s: 0.004
    tau_std_nm: 0.05
  acceleration_estimator: causal_savgol
  acceleration_window_samples: 21

# ------------------------------------------------------------------ Phase A: basis capacity audit
basis_audit:
  time_subsample: 8                 # every 8th sample (250 ms^-1 * 8 = 62.5 Hz) for the Gram statistics
  rank_tolerance: 1.0e-10           # eigenvalue > tol * lambda_max counts towards the rank (float64)
  condition_threshold: 1.0e8        # rule 3
  condition_window_fraction: 0.30   # rule 3
  oracle_window_samples: 128
  oracle_window_stride: 128         # non-overlapping windows for the per-window oracle problems
  oracle_heldout_period: 4          # every 4th time step held out for lambda selection (healthy VAL only)
  lambda_tikhonov_grid: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
  lambda_smoothness_grid: [0.0, 1.0e-2, 1.0e-1, 1.0, 10.0, 100.0]
  oracle_rmse_relative_margin: 0.10   # rule 1: basis test RMSE > free * 1.10
  window_relative_residual_margin: 0.20  # rule 2: rel_basis > 1.2 * rel_free ...
  window_relative_residual_fraction: 0.30  # ... in > 30 % of healthy windows
  stable_redundancy_min_fraction: 0.99   # rule 4: exact dependency holds (rel. residual < 1e-8) in >= 99 % of samples
  stable_redundancy_tolerance: 1.0e-8
  reduced_basis_no_loss_tolerance: 1.0e-3  # rule 4: dropping the redundant column changes oracle RMSE by < 0.1 % relative
  mismatch_projection_threshold: 0.10      # rule 5 (pre-declared): median relative projection residual > 10 %
  random_frame_trials: 8
  frame_invariance_tolerance: 1.0e-8

# ------------------------------------------------------------------ Phase B/C: models and fair tuning
models:
  primary_baseline: chain_gnn_aug
  primary_candidate: ligra_v2_typed
  diagnostics: [rnea_gru, ligra_free_output]
  parameter_match_tolerance: 0.10
  # baseline widths are the PR #2 values (chain_gnn_aug 60,743 params); LiGRA-v2 typed widths are set
  # so that its parameter count lands within +-10 % of the baseline (verified by test + audit JSON)
  scalar_hidden_dim: 64
  scalar_layers: 2
  baseline_gru_hidden: 80
  ligra_v2:
    scalar_hidden: 48
    twist_channels: 6
    wrench_channels: 6
    invariant_gate_hidden: 48

training:
  fractions: [0.25, 1.00]
  tuning_seed: 260815
  final_seeds: [260815, 260816, 260817]
  tuning_grid:
    learning_rate: [0.0002, 0.0005, 0.001, 0.002]
    scheduler: [cosine, reduce_on_plateau]
  tune_on_faults: false
  epochs: 40
  min_epochs: 15
  patience: 10
  batch_size: 64
  weight_decay: 1.0e-6
  grad_clip: 1.0
  main_acceleration_input: qdd_est
  oracle_acceleration_diagnostic: qdd_true
  selection_metric: healthy_val_rmse         # healthy validation torque-correction RMSE only
  selection_tie_relative: 0.01               # <1 % difference -> prefer the more stable / smaller-lr configuration

frame_trials:
  variants_per_episode: 8
  rotation_angle_max_deg: 180
  translation_fraction_of_link_length: 0.25
  tolerance_float64_relative: 1.0e-9
  tolerance_float32_relative: 1.0e-4

anomaly:
  primary_representation: residual_only
  head: conditional_gaussian
  threshold_quantile: 0.995
  flow_enabled: false
  use_faults_for_threshold: false

localization:
  primary: counterfactual_link_masking
  secondary: joint_residual_pattern
  internal_message_energy_primary: false

decision:
  axis_auroc_margin: 0.03
  axis_fpr_relative_reduction: 0.25
  sample_efficiency_auroc_tolerance: 0.02
  healthy_rmse_tolerance: 0.10
  localization_top1_margin: 0.10
  localization_chain_distance_margin: 0.25
  parity_band_auroc: 0.02
  frame_drift_ratio_min: 100.0
  min_families: 2
  min_seeds: 2

execution:
  max_cpu_threads: 8
  single_gpu_process: true
  require_clean_worktree: true
  require_r0_pass: true
  build_thin_full_review_packages: true
