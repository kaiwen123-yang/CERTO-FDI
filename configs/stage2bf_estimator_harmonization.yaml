# CERTO-FDI Stage 2B-F: contact-localizer estimator harmonization and finalization.
#
# Derived from the frozen kickoff template 10_STAGE2BF_CONFIG.yaml
# (kickoff zip sha256 c4e89673f76027960a9d4f3de20245c7a955ca4a75fca43a4be0eeb0ead3b580).
# Every value under `frozen_inputs`, `estimators`, `reproduction` and `integrity_precedence` is
# copied verbatim. Committed BEFORE any Stage 2B-F score exists.
#
# This stage is NOT new research. It separates two estimators Stage 2B conflated, reproduces both
# pipelines like-for-like, measures whether Stage 2B's mechanism conclusions depend on which
# estimator is used, and -- only if the integrity gate passes -- re-runs the ORIGINAL frozen
# Stage 2B decision function with every scientific metric and threshold unchanged.
