[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certo-fdi"
version = "0.1.0"
description = "CERTO-FDI: certificate/representation falsification for robot fault diagnosis, plus the paper-reset public-benchmark audit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "sympy>=1.12",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "hypothesis>=6.90",
  "jax>=0.4.26",
  "cvxpy>=1.4",
  "osqp>=0.6.3",
]
# Heavy runtime deps for the paper-reset public-benchmark stage. Kept out of
# `dev` so CI stays a fast, CPU-only contract/decision-code gate.
paper-reset = [
  "torch>=2.4",
  "scikit-learn>=1.4",
  "h5py>=3.10",
  "requests>=2.31",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: long-running experiment-scale tests (excluded in CI)",
]
