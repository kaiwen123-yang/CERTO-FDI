[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certo-fdi"
version = "0.3.0"
description = "CERTO-FDI Stage 2A: chain-structured healthy residual + joint-Cartesian fault-pathway geometry audit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "sympy>=1.12",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "h5py>=3.9",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
sim = [
  "mujoco>=3.1",
  "pin>=3.4",
]
learn = [
  "torch>=2.7",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "hypothesis>=6.90",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: long-running experiment-scale tests (excluded in CI)",
  "sim: requires mujoco/pinocchio (skipped when unavailable)",
  "gpu: requires CUDA",
]
